name: update readme stats

# The public github-readme-stats.vercel.app instance is paused, so the card is
# generated here and committed to the repo instead.

on:
  schedule:
    - cron: "43 3 * * *" # once a day, away from the daily check-in run
  push:
    branches: [main]
    paths: [.github/workflows/readme-stats.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=avisink&include_all_commits=true&show_icons=true&hide_border=true&title_color=c77dff&icon_color=9d4edd&text_color=e0aaff&bg_color=10002b
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update readme stats card" || exit 0
          git pull --rebase
          git push
